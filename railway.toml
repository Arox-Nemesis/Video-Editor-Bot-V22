[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m main"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "video-editor-bot"

[services.variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

[deploy.healthcheck]
path = "/health"
port = 8080