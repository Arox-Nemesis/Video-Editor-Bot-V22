version: "1.0"

app:
  name: video-editor-bot
  type: worker   # Telegram bots run as background workers, not web apps
  runtime: docker

build:
  dockerfile: Dockerfile

run:
  command: python bot/main.py

env:
  - key: API_ID
    value: ${API_ID}
  - key: API_HASH
    value: ${API_HASH}
  - key: BOT_TOKEN
    value: ${BOT_TOKEN}
  - key: MONGO_URI
    value: ${MONGO_URI}
  - key: LOG_CHANNEL
    value: ${LOG_CHANNEL}
